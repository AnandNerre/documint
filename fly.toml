# Fly.io — alternative free deploy
# Install: https://fly.io/docs/hands-on/install-flyctl/
# Then: fly launch --no-deploy && fly deploy

app = "payleaf"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVE_STATIC = "true"
  CORS_ORIGINS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
