# Render.com — free Docker deploy (one-click from GitHub)
# Dashboard: https://dashboard.render.com → New → Blueprint → connect repo

services:
  - type: web
    name: documint
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SERVE_STATIC
        value: "true"
      - key: CORS_ORIGINS
        value: "https://documint.onrender.com,https://documint.dpdns.org,https://yaworldu.wixsite.com"
      - key: PORT
        value: "8000"
